[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent"
version = "0.1.0"
description = "A modular desktop voice agent with pluggable STT, LLM, TTS, memory and tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2",
  "sounddevice>=0.5,<1",
]

[project.optional-dependencies]
local-stt = [
  "faster-whisper>=1.2,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
voice-agent = "voice_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
